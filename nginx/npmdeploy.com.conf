# /etc/nginx/sites-available/npmdeploy.com
#
# SETUP STEPS:
#   1. sudo cp nginx/npmdeploy.com.conf /etc/nginx/sites-available/npmdeploy.com
#   2. sudo ln -s /etc/nginx/sites-available/npmdeploy.com /etc/nginx/sites-enabled/
#   3. Add the map block below to /etc/nginx/nginx.conf inside the http{} block
#      (or to /etc/nginx/conf.d/upgrade-map.conf)
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d npmdeploy.com -d www.npmdeploy.com
#      Certbot will automatically add the SSL server block and the HTTP redirect.
#
# After step 5 this file will be modified in-place by certbot to include TLS.
# -------------------------------------------------------------------------

# ---- WebSocket upgrade map ----
# Add this to your /etc/nginx/nginx.conf http{} block (or conf.d/upgrade-map.conf)
# if it is not already present:
#
#   map $http_upgrade $connection_upgrade {
#       default  upgrade;
#       ''       close;
#   }

# -------------------------------------------------------------------------
# HTTP — serves the app directly; certbot will convert this to a redirect
# after issuing the certificate.
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name npmdeploy.com www.npmdeploy.com;

    # ---- Let's Encrypt ACME challenge ----
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Limits & timeouts (allow long deploy operations) ----
    client_max_body_size    50m;
    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
    send_timeout            300s;
    keepalive_timeout       75s;

    # ---- WebSocket upgrade ----
    proxy_http_version  1.1;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;

    # ---- Common proxy headers ----
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Forwarded-Host  $host;

    # Buffer settings
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # ---- All traffic → NodeDeploy portal on port 3000 ----
    location / {
        proxy_pass     http://127.0.0.1:3000;
        proxy_redirect off;
    }

    # ---- Access & error logs ----
    access_log  /var/log/nginx/npmdeploy.com.access.log combined;
    error_log   /var/log/nginx/npmdeploy.com.error.log warn;
}

# -------------------------------------------------------------------------
# HTTPS block — DO NOT add this manually.
# After running certbot, it will automatically insert a server block here
# with TLS configuration, HSTS, and an HTTP→HTTPS redirect.
#
# To add security headers after certbot runs, add these to the SSL block:
#
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#   add_header X-Frame-Options            SAMEORIGIN                                    always;
#   add_header X-Content-Type-Options     nosniff                                       always;
#   add_header X-XSS-Protection           "1; mode=block"                               always;
#   add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
# -------------------------------------------------------------------------
