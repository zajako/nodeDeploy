# /etc/nginx/sites-available/npmdeploy.com
#
# SETUP STEPS:
#   1. sudo cp nginx/npmdeploy.com.conf /etc/nginx/sites-available/npmdeploy.com
#   2. sudo ln -s /etc/nginx/sites-available/npmdeploy.com /etc/nginx/sites-enabled/
#   3. Add the map block and sudo rule below, then:
#      sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d npmdeploy.com -d www.npmdeploy.com
#
# SUDOERS (allow portal to reload nginx without a password):
#   Run: sudo visudo
#   Add: zajako ALL=(ALL) NOPASSWD: /usr/sbin/nginx -s reload
#
# MAP BLOCK — add to /etc/nginx/nginx.conf inside the http { } block
# (skip if already present):
#
#   map $http_upgrade $connection_upgrade {
#       default  upgrade;
#       ''       close;
#   }
# -------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name npmdeploy.com www.npmdeploy.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name npmdeploy.com www.npmdeploy.com;

    # ---- TLS (filled in by certbot) ----
    ssl_certificate     /etc/letsencrypt/live/npmdeploy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npmdeploy.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            SAMEORIGIN                                    always;
    add_header X-Content-Type-Options     nosniff                                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- Timeouts & size ----
    client_max_body_size  50m;
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---- Common proxy headers (inherited by all locations below) ----
    proxy_http_version  1.1;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # ---- Per-project location blocks (auto-generated by NodeDeploy) ----
    # Each deployed app gets its own location /AppName/ block that proxies
    # directly to the app's dedicated port — no Express proxy layer involved.
    include /home/zajako/nodeDeploy/nginx/projects.conf;

    # ---- NodeDeploy admin portal (catch-all) ----
    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_redirect      off;
        proxy_set_header    Connection $connection_upgrade;
    }

    access_log  /var/log/nginx/npmdeploy.com.access.log combined;
    error_log   /var/log/nginx/npmdeploy.com.error.log warn;
}
