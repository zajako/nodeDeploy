# /etc/nginx/sites-available/npmdeploy.com
# Symlink: ln -s /etc/nginx/sites-available/npmdeploy.com /etc/nginx/sites-enabled/

# -------------------------------------------------------------------------
# HTTP → HTTPS redirect
# -------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name npmdeploy.com www.npmdeploy.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------------
# HTTPS — main server
# -------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name npmdeploy.com www.npmdeploy.com;

    # ---- TLS (Let's Encrypt via Certbot) ----
    ssl_certificate     /etc/letsencrypt/live/npmdeploy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npmdeploy.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            SAMEORIGIN                                    always;
    add_header X-Content-Type-Options     nosniff                                       always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Limits & timeouts (allow long deploy operations) ----
    client_max_body_size    50m;
    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
    send_timeout            300s;
    keepalive_timeout       75s;

    # ---- WebSocket upgrade map ----
    proxy_http_version  1.1;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        "upgrade";

    # ---- Common proxy headers ----
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Forwarded-Host  $host;

    # Buffer settings
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # ---- Static assets served directly (optional optimisation) ----
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- All traffic → NodeDeploy portal on port 3000 ----
    # The portal handles proxy routing internally for deployed apps.
    location / {
        proxy_pass          http://127.0.0.1:3000;
        proxy_redirect      off;

        # Reset Connection header for regular HTTP requests
        proxy_set_header    Connection        $connection_upgrade;
    }

    # ---- Access & error logs ----
    access_log  /var/log/nginx/npmdeploy.com.access.log combined;
    error_log   /var/log/nginx/npmdeploy.com.error.log warn;
}

