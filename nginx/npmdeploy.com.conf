# /etc/nginx/sites-available/npmdeploy.com
#
# SETUP STEPS:
#   1. sudo cp nginx/npmdeploy.com.conf /etc/nginx/sites-available/npmdeploy.com
#   2. sudo ln -s /etc/nginx/sites-available/npmdeploy.com /etc/nginx/sites-enabled/
#   3. sudo ln -sf /home/zajako/nodeDeploy/nginx/projects.conf \
#                  /etc/nginx/sites-enabled/nodedeploy-projects.conf
#   4. Add the map block below to /etc/nginx/nginx.conf inside http { }, then:
#      sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d npmdeploy.com -d www.npmdeploy.com
#   6. For HTTPS on project subdomains, get a wildcard cert (DNS challenge).
#      Use a certbot DNS plugin so it AUTO-RENEWS (see README step 7), e.g.:
#      sudo certbot certonly --dns-cloudflare \
#        --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#        -d npmdeploy.com -d '*.npmdeploy.com'
#      (--manual works too but cannot auto-renew — expires every 90 days.)
#      Then set WILDCARD_CERT_DOMAIN=npmdeploy.com in .env and restart portal.
#
# SUDOERS (allow portal to reload nginx without a password):
#   Run: sudo visudo
#   Add: zajako ALL=(ALL) NOPASSWD: /usr/sbin/nginx -s reload
#
# MAP BLOCK — add to /etc/nginx/nginx.conf inside the http { } block
# (skip if already present):
#
#   map $http_upgrade $connection_upgrade {
#       default  upgrade;
#       ''       close;
#   }
# -------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name npmdeploy.com www.npmdeploy.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name npmdeploy.com www.npmdeploy.com;

    # ---- TLS (filled in by certbot) ----
    ssl_certificate     /etc/letsencrypt/live/npmdeploy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npmdeploy.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            SAMEORIGIN                                    always;
    add_header X-Content-Type-Options     nosniff                                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ---- Timeouts & size ----
    client_max_body_size  50m;
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---- Portal (catch-all) ----
    # All requests to npmdeploy.com go directly to the portal.
    # Each project app is served from its own subdomain server block in
    # nginx/projects.conf (auto-generated and symlinked into sites-enabled).
    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_redirect      off;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $connection_upgrade;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    access_log  /var/log/nginx/npmdeploy.com.access.log combined;
    error_log   /var/log/nginx/npmdeploy.com.error.log warn;
}
